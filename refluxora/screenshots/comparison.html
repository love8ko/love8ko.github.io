<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Compare A / B · Refluxora</title><link rel="stylesheet" href="gallery.css?v=concept-2"><link rel="stylesheet" href="product.css?v=concept-2"></head><body><nav class="project-nav" aria-label="Refluxora workbenches"><a class="wordmark" href="../index.html">refluxora</a><div><a href="../design.html">Design</a><a href="../flow.html">Flow</a><a href="./" aria-current="page">Screenshots</a></div><span class="nav-note">WORKBENCH</span></nav><main class="document"><header class="intro"><span class="eyebrow">A / B · SAME STORY, DIFFERENT EMPHASIS</span><h1>Compare each pair.</h1><p class="lead">A — Human. B — Product. All six are design concepts.</p><div class="page-links"><a href="comparison.png">Download contact sheet ↗</a><a href="./">Back to all frames ↗</a></div></header><div id="pairs">Loading comparisons…</div></main><footer><a href="./">← Back to screenshot review</a><span>English · Design concepts · Not for App Store</span></footer><script>fetch('gallery.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const target=document.querySelector('#pairs');target.replaceChildren();for(let i=0;i<3;i++){const section=document.createElement('section');section.className='doc-section';const h=document.createElement('h2');h.textContent=data.series[0].frames[i].headline;section.append(h);const row=document.createElement('div');row.className='comparison-pair';for(const s of data.series){const f=s.frames[i],figure=document.createElement('figure'),cap=document.createElement('figcaption'),a=document.createElement('a'),img=document.createElement('img');cap.textContent=f.id+' · '+s.name;a.href=f.original+'?v='+data.version;img.src=f.preview+'?v='+data.version;img.alt=f.headline;img.style='width:100%;border-radius:14px;display:block';img.addEventListener('error',()=>{a.text
