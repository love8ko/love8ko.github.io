<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hepatica localization visual QA</title><link rel="stylesheet" href="gallery.css?v=r12"><style>main{max-width:1500px}.locale-review{break-inside:avoid;margin:28px 0 42px}.locale-review h2{margin:0 0 12px}.locale-review .sheet-grid{grid-template-columns:repeat(8,1fr);max-width:none;gap:10px}.locale-review figcaption{font-size:10px}.locale-review img{border-radius:5px}</style></head><body><main><h1 id="title">Localization visual QA</h1><div id="content"></div></main><script>const params=new URLSearchParams(location.search),batch=Number(params.get('batch')||0);window.ready=fetch('locale-config.json?v=r12',{cache:'no-store'}).then(r=>r.json()).then(async c=>{const locales=c.locales.slice(batch*10,batch*10+10);document.getElementById('title').textContent='Hepatica r12 · visual QA · batch '+(batch+1);for(const l of locales){const d=await fetch(l.data+'?v=r12',{cache:'no-store'}).then(r=>r.json()),section=document.createElement('section'),h=document.createElement('h2'),grid=document.createElement('div');section.className='locale-review';section.dir=l.dir;h.textContent=l.code+' · '+l.label;grid.className='sheet-grid';for(const f of d.frames){const fig=document.createElement('figure'),cap=document.createElement('figcaption'),img=document.createElement('img');cap.textContent=f.slot;img.src=f.preview;img.alt=f.headline.join(' ');fig.append(cap,img);grid.append(fig);}section.append(h,grid);document.getElementById('content').append(section);}await Promise.all([...document.images].map(i=>i.decode()));});</script></body></html>
