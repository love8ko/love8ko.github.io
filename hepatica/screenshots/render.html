<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hepatica deterministic artwork renderer</title><link rel="stylesheet" href="art.css"><script src="product-layout.js"></script><script src="layout.js"></script></head><body><script>
const params=new URLSearchParams(location.search),dataPath=params.get('data')||'gallery.json';window.ready=fetch(dataPath).then(r=>r.json()).then(data=>{const key=params.get('key')||data.frames[0].renderKey;const f=data.frames.find(f=>f.renderKey===key||f.id===key);if(!f)throw Error('Unknown frame');document.body.replaceChildren(hepaticaLayout(f,data));return document.fonts.ready;}).then(()=>Promise.all([...document.images].map(i=>i.decode())));
</script></body></html>
