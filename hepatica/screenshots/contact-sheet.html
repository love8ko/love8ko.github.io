<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hepatica · H01–H03 вместе</title><link rel="stylesheet" href="gallery.css"></head><body><nav><a class="wordmark" href="../design.html">Hepatica</a><div class="links"><a href="./">Screenshots</a><a href="rationale.html">Обоснования</a></div></nav><main><div class="eyebrow">English · en-US · r1 · For review</div><h1>H01–H03 · начало истории</h1><p class="muted">Вопрос о печени → обычное блюдо → понятный термин в анализах. Иллюстративные концепты.</p><div class="sheet-grid" id="sheet"></div></main><script>window.ready=fetch('gallery.json').then(r=>r.json()).then(d=>{d.frames.forEach(f=>{const fig=document.createElement('figure'),cap=document.createElement('figcaption'),img=document.createElement('img');cap.textContent=f.id;img.src=f.preview;img.alt=f.headline.join(' ');fig.append(cap,img);document.getElementById('sheet').append(fig);});return Promise.all([...document.images].map(i=>i.decode()));});</script></body></html>
