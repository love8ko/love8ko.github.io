<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hepatica · locale contact sheet</title><link rel="stylesheet" href="gallery.css?v=r12"></head><body><nav><a class="wordmark" href="../design.html">Hepatica</a><a href="./?v=r12">Screenshots</a></nav><main><div class="eyebrow">r12 · 50 locales</div><h1 id="title">Контактный лист</h1><label class="locale-picker">Язык <select id="locale-picker"></select></label><div id="sheet" class="sheet-grid"></div></main><script>window.ready=fetch('locale-config.json?v=r12',{cache:'no-store'}).then(r=>r.json()).then(async c=>{const p=document.getElementById('locale-picker');for(const l of c.locales){const o=document.createElement('option');o.value=l.code;o.textContent=l.label;p.append(o);}async function load(code){const l=c.locales.find(x=>x.code===code)||c.locales[0],d=await fetch(l.data+'?v=r12',{cache:'no-store'}).then(r=>r.json());p.value=l.code;document.documentElement.lang=l.lang;document.documentElement.dir=l.dir;document.getElementById('title').textContent='Hepatica · '+l.label;const s=document.getElementById('sheet');s.replaceChildren();for(const f of d.frames){const fig=document.createElement('figure'),cap=document.createElement('figcaption'),img=document.createElement('img');cap.textContent=f.slot;img.src=f.preview;img.alt=f.headline.join(' ');fig.append(cap,img);s.append(fig);}await Promise.all([...s.querySelectorAll('img')].map(i=>i.decode()));}p.onchange=()=>load(p.value);await load(new URLSearchParams(location.search).get('locale')||c.defaultLocale);});</script></body></html>
