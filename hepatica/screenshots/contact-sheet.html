<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hepatica · r11 · pilot locales</title><link rel="stylesheet" href="gallery.css?v=r11"></head><body><nav><a class="wordmark" href="../design.html">Hepatica</a><div class="links"><a href="./?v=r11">Screenshots</a><a href="archive/r10/">English master</a></div></nav><main><div class="eyebrow">r11 · 24 translations for review · English r10 approved</div><h1>Все четыре локали</h1><p class="muted">Русский · Deutsch · 简体中文 · English. По восемь кадров в каждой локали.</p><div id="sheet"></div></main><script>window.ready=fetch('gallery.json?v=r11',{cache:'no-store'}).then(r=>r.json()).then(d=>{for(const l of d.locales){const section=document.createElement('section'),h=document.createElement('h2'),grid=document.createElement('div');h.textContent=l.name+' · '+l.status;grid.className='sheet-grid';for(const f of d.frames.filter(f=>f.locale===l.locale)){const fig=document.createElement('figure'),cap=document.createElement('figcaption'),img=document.createElement('img');fig.lang=l.locale;cap.textContent=f.slot;img.src=f.preview;img.alt=f.headline.join(' ');fig.append(cap,img);grid.append(fig);}section.append(h,grid);document.getElementById('sheet').append(section);}return Promise.all([...document.images].map(i=>i.decode()));});</script></body></html>
