<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hepatica · сравнение вариантов</title><link rel="stylesheet" href="gallery.css?v=r11"></head><body><nav><a class="wordmark" href="../design.html">Hepatica</a><div class="links"><a href="./?v=r11">Локализации</a><a href="archive/">Архив</a></div></nav><main><h1>Все варианты</h1><p class="lead">Текущий r11: три пилотных перевода утверждённой английской серии r10.</p><div id="comparisons"></div><p class="muted">Английский мастер и прошлые изображения сохранены без изменений.</p></main><script>
window.ready=Promise.all(['r11','r10','r9','r8','r7','r6','r5','r4','r3','r2','r1'].map(async rev=>{const prefix=rev==='r11'?'':'archive/'+rev+'/';return{rev,prefix,data:await fetch(prefix+'gallery.json?v='+rev,{cache:'no-store'}).then(r=>r.json())};})).then(all=>{for(const {rev,prefix,data} of all){const groups=rev==='r11'?data.locales.map(l=>({id:l.locale,title:l.name+' · '+l.status,frames:data.frames.filter(f=>f.locale===l.locale)})):(data.variants||[{id:'',title:'Предыдущий вариант'}]).map(v=>({id:v.id,title:v.title,frames:data.frames.filter(f=>!v.id||f.variant===v.id)}));for(const group of groups){const section=document.createElement('section'),h=document.createElement('h2'),grid=document.createElement('div');h.textContent=rev+' · '+group.title;grid.className='sheet-grid';for(const f of group.frames){const fig=document.createElement('figure'),cap=document.createElement('figcaption'),img=document.createElement('img'),a=document.createElement('a');fig.lang=f.locale||'en-US';cap.textContent=(f.slot||f.id)+' · '+(f.locale||'en-US');img.src=prefix+f.preview;img.alt=f.headline.join(' ');a.href=prefix+f.original;a.append(img);fig.append(cap,a);grid.append(fig);}section.append(h,grid);document.getElementById('comparisons').append(section);}}return Promise.all([...document.images].map(i=>i.decode()));});
</script></body></html>
