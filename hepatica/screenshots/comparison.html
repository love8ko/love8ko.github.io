<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hepatica · сравнение вариантов</title><link rel="stylesheet" href="gallery.css?v=r8"></head><body><nav><a class="wordmark" href="../design.html">Hepatica</a><div class="links"><a href="./">Вся восьмёрка</a><a href="archive/">Архив</a></div></nav><main><h1>Все варианты</h1><p class="lead">Текущий r8: полная английская серия H01–H08. Первые три кадра сохранены из r7; добавлены пять новых ситуаций.</p><div id="comparisons"></div><p class="muted">Прошлые изображения сохранены без изменений. Это варианты дизайна, не результаты теста конверсии.</p></main><script>
window.ready=Promise.all(['r8','r7','r6','r5','r4','r3','r2','r1'].map(async rev=>{const prefix=rev==='r8'?'':'archive/'+rev+'/';return{rev,prefix,data:await fetch(prefix+'gallery.json?v='+rev,{cache:'no-store'}).then(r=>r.json())};})).then(all=>{for(const {rev,prefix,data} of all){const variants=data.variants||[{id:'',title:'Предыдущий вариант'}];for(const v of variants){const section=document.createElement('section'),h=document.createElement('h2'),grid=document.createElement('div');h.textContent=rev+' · '+v.title;grid.className='sheet-grid';for(const f of data.frames.filter(f=>!v.id||f.variant===v.id)){const fig=document.createElement('figure'),cap=document.createElement('figcaption'),img=document.createElement('img'),a=document.createElement('a');cap.textContent=f.id+' · '+rev;img.src=prefix+f.preview;img.alt=f.headline.join(' ');a.href=prefix+f.original;a.append(img);fig.append(cap,a);grid.append(fig);}section.append(h,grid);document.getElementById('comparisons').append(section);}}return Promise.all([...document.images].map(i=>i.decode()));});
</script></body></html>
