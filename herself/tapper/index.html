  app.appendChild(el("h2",{},"Имя пути (чтобы я различал попытки)")); const n=el("input",{placeholder:"например: работа-1"}); n.value=st.name||""; n.oninput=()=>{st.name=n.value}; app.appendChild(n);
  const go=el("button",{className:"go",textContent:"Готово — показать ответы"}); go.onclick=()=>{st.lang=st.lang||"ru"; out.textContent="ТАПАЛКА "+JSON.stringify(st,null,1); cp.style.display="block"}; app.appendChild(go);
  const out=el("pre"); app.appendChild(out);
  const cp=el("button",{textContent:"Скопировать",style:"display:none"}); cp.onclick=()=>{navigator.clipboard.writeText(out.textContent).then(()=>{cp.textContent="Скопировано — вставь в чат"})}; app.appendChild(cp);
  const again=el("button",{textContent:"Пройти заново"}); again.onclick=()=>{for(const k in st) delete st[k]; draw(); scrollTo(0,0)}; app.appendChild(again);
}
draw();
</script></body></html>
