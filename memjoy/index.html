<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Memjoy: Brain Games for Adults — privacy, terms, support and product page.">
<title>Memjoy</title>
<meta name="theme-color" content="#FAF2E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2D2027" media="(prefers-color-scheme: dark)">
<style>
:root{--paper:#FAF2E6;--card:#FFF8EE;--ink:#472B33;--muted:#6F5560;--accent:#812A43;--accent-soft:#F1DDD8;--line:#E3D3C2;--on-lit:#FFF8EE;--lit:linear-gradient(135deg,#6A2036 0%,#812A43 60%,#B5566B 100%);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#2D2027;--card:#38282F;--ink:#F3E6E8;--muted:#C2AAB1;--accent:#F0A8B9;--accent-soft:#4A3039;--line:#4A3640;--on-lit:#FFF8EE;--lit:linear-gradient(135deg,#4A1D2C 0%,#6E2C41 60%,#94475C 100%);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#2D2027;--card:#38282F;--ink:#F3E6E8;--muted:#C2AAB1;--accent:#F0A8B9;--accent-soft:#4A3039;--line:#4A3640;--on-lit:#FFF8EE;--lit:linear-gradient(135deg,#4A1D2C 0%,#6E2C41 60%,#94475C 100%);color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.6 system-ui,-apple-system,"SF Pro Text",sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px 64px}
h1,h2,h3{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;font-weight:700;line-height:1.2}
h1{font-size:36px;margin:0 0 6px}h2{font-size:24px;margin:40px 0 10px;padding-top:12px;border-top:1px solid var(--line)}h3{font-size:19px;margin:24px 0 6px}
p,ul,ol{margin:0 0 14px}ul,ol{padding-left:22px}li{margin-bottom:6px}
a{color:var(--accent);text-underline-offset:2px}
.meta{color:var(--muted);font-size:15px;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:16px 0}
.card p:last-child,.card ul:last-child{margin-bottom:0}
.notes{background:transparent;border-style:dashed;font-size:15px;color:var(--muted);margin-top:48px}
.notes h2{font-size:18px;margin:0 0 8px;padding:0;border:0;color:var(--ink)}
.crisis{border-left:4px solid var(--accent)}
.foot{margin-top:32px;color:var(--muted);font-size:15px}
nav.toc ol{padding-left:22px;margin:0}nav.toc li{margin-bottom:2px}
.tbd{background:var(--accent-soft);border-radius:4px;padding:0 4px;font-size:.9em}
@media(max-width:480px){body{font-size:17px}h1{font-size:30px}h2{font-size:22px}}
</style>
</head>
<body>
<main>
<h1>Memjoy</h1>
<p class="meta">Memjoy: Brain Games for Adults · Loveiko Labs</p>
<ul>
<li><a href="marketing.html">About Memjoy</a></li>
<li><a href="support.html">Support</a></li>
<li><a href="privacy.html">Privacy Policy</a></li>
<li><a href="terms.html">Terms of Use</a></li>
</ul>
<p class="foot">Questions? <a href="mailto:loveykovl@gmail.com?subject=Memjoy%20%E2%80%94%20question%20or%20feedback">loveykovl@gmail.com</a></p>
</main>
</body>
</html>
