<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Two Sparrows — скриншоты</title><style>:root{--bg:#F6EEDF;--surface:#FFFAF0;--ink:#2B211B;--muted:#6F5A4C;--accent:#9C4E33;--soft:#EAD3C4;--rule:#D9CBB6}
@media (prefers-color-scheme:dark){:root{--bg:#17120F;--surface:#221B17;--ink:#E3D6C1;--muted:#A89886;--accent:#D98B66;--soft:#4A3328;--rule:#3A302A}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:28px 16px 80px}h1{font:600 34px/1.15 Georgia,serif;margin:0 0 8px}h2{font:600 22px Georgia,serif;margin:40px 0 12px}
.lead{color:var(--muted);font-size:18px;margin:0 0 24px;max-width:860px}small,.muted{color:var(--muted)}a{color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}@media (max-width:900px){.cards{grid-template-columns:1fr 1fr}}@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{display:block;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:18px;text-decoration:none;color:var(--ink);transition:transform .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}.card h3{margin:6px 0 6px;font:600 19px Georgia,serif}.card p{margin:0;color:var(--muted);font-size:14px}.card .ic{font-size:26px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 8px}@media (max-width:760px){.facts{grid-template-columns:1fr 1fr}}
.facts div{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px}.facts b{display:block;font-size:20px}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}@media (max-width:900px){.shots{grid-template-columns:repeat(2,1fr)}}
.shot{margin:0}.shot img{width:100%;border-radius:22px;border:1px solid var(--rule);background:var(--surface)}.shot figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.wide{grid-column:span 2}
.ts-nav{position:sticky;top:0;z-index:50;background:rgba(246,238,223,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid #D9CBB6}
.ts-nav .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:6px;align-items:center;overflow-x:auto;white-space:nowrap}
.ts-nav .brand{font:600 16px Georgia,'Times New Roman',serif;color:#2B211B;text-decoration:none;margin-right:10px}
.ts-nav a.i{font:500 14px -apple-system,system-ui,sans-serif;color:#6F5A4C;text-decoration:none;padding:6px 10px;border-radius:999px}
.ts-nav a.i:hover{background:#EAD3C4;color:#2B211B}.ts-nav a.i.on{background:#9C4E33;color:#FFFAF0}
@media (prefers-color-scheme:dark){.ts-nav{background:rgba(23,18,15,.9);border-color:#3A302A}.ts-nav .brand{color:#E3D6C1}.ts-nav a.i{color:#A89886}.ts-nav a.i:hover{background:#4A3328;color:#E3D6C1}.ts-nav a.i.on{background:#D98B66;color:#17120F}}
html{scroll-padding-top:64px}
